name: One-off Core Release v1.11.5

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/release-core-v1.11.5.yml"

permissions:
  contents: write

jobs:
  package-and-release:
    name: Package apps/core and publish v1.11.5
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout apps/core
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            apps/core

      - name: Package apps/core
        shell: bash
        run: |
          cd apps
          zip -r -1 -q ../noname-core-v1.11.5.zip core
          cd ..
          sha256sum noname-core-v1.11.5.zip > noname-core-v1.11.5.zip.sha256
          unzip -tq noname-core-v1.11.5.zip

      - name: Create release and upload package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 661ddffce0380f49a9e4751010b1fe09513dd575
        run: |
          gh release create v1.11.5             noname-core-v1.11.5.zip             noname-core-v1.11.5.zip.sha256             --repo "$GITHUB_REPOSITORY"             --target "$TARGET_SHA"             --title "v1.11.5"             --notes-file apps/core/game/updateLog.md             --latest
